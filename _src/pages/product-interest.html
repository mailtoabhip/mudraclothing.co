<section class="wrap likes-report" data-likes-report>
  <p>Likes count browser instances, not verified people. Each browser can like a tee once and undo it.</p>
  <p class="mono" data-likes-updated>Loading product likes.</p>
  <div role="status" data-likes-status></div>
  <a href="/api/customer/login">Sign in with your owner customer account</a>
  <table><caption class="mono">Current likes by tee</caption><thead><tr><th scope="col">Tee</th><th scope="col">Likes</th></tr></thead><tbody data-likes-rows></tbody></table>
  <button type="button" class="mono" data-likes-refresh>Refresh counts</button>
</section>
